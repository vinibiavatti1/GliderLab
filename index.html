<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">

    <title>Document</title>
    <link rel="stylesheet" href="./style.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
</head>




<body class="bg-1">

    <div class="bg-2">
        <div class="p-1">
            <div class="btn-group" role="group">
                <div id="app-btn-settings" class="px-4 fw-bold">
                    <span>Glider Lab</span>
                </div>
            </div>

            <div class="app-divider border-start border-body border-1"></div>
            <div class="btn-group" role="group">
                <button id="app-btn-open" class="btn-icon border-0">
                    <i class="bi bi-file-earmark"></i>
                </button>
                <button id="app-btn-open" class="btn-icon border-0">
                    <i class="bi bi-folder2-open"></i>
                </button>
                <button id="app-btn-save" class="btn-icon border-0">
                    <i class="bi bi-floppy"></i>
                </button>
            </div>

            <div class="app-divider border-start border-body border-1"></div>
            <div class="btn-group" role="group">
                <button id="app-btn-undo" type="button" class="btn-icon border-0" disabled>
                    <i class="bi bi-arrow-counterclockwise"></i>
                </button>
                <button id="app-btn-redo" type="button" class="btn-icon border-0" disabled>
                    <i class="bi bi-arrow-clockwise"></i>
                </button>
            </div>

            <div class="app-divider border-start border-body border-1"></div>
            <div class="btn-group" role="group">
                <button id="app-btn-settings" type="button" class="btn-icon border-0">
                    <i class="bi bi-gear"></i>
                </button>
            </div>

            <div class="app-divider border-start border-body border-1"></div>
            <div class="btn-group" role="group">
                <button id="app-btn-redo" type="button" class="btn-icon border-0">
                    <i class="bi bi-question-circle"></i>
                </button>
                <button id="app-btn-undo" type="button" class="btn-icon border-0">
                    <i class="bi bi-github"></i>
                </button>
            </div>
        </div>
        <div class="p-1 border-1 border-bottom border-body">
            <div class="btn-group" role="group">
                <button id="app-btn-automata" class="btn border-0">
                    Game of Life - 23/3
                </button>
            </div>

            <div class="app-divider border-start border-body border-1"></div>
            <div class="btn-group" role="group">
                <button id="app-btn-play" class="btn-icon border-0 fg-success">
                    <i class="bi bi-play"></i>
                </button>
                <button id="app-btn-pause" class="btn-icon border-0 fg-warning" disabled>
                    <i class="bi bi-pause"></i>
                </button>
                <button id="app-btn-stop" class="btn-icon border-0 fg-danger" disabled>
                    <i class="bi bi-stop"></i>
                </button>
                <button id="app-btn-step" class="btn-icon border-0">
                    <i class="bi bi-skip-end"></i>
                </button>

            </div>

            <div class="app-divider border-start border-body border-1"></div>
            <div class="btn-group" role="group">
                <button id="app-btn-1x" type="button" class="btn-icon border-0 active">
                    1x
                </button>
                <button id="app-btn-2x" type="button" class="btn-icon border-0">
                    2x
                </button>
                <button id="app-btn-4x" type="button" class="btn-icon border-0">
                    4x
                </button>
                <button id="app-btn-8x" type="button" class="btn-icon border-0">
                    8x
                </button>
                <button id="app-btn-16x" type="button" class="btn-icon border-0">
                    16x
                </button>
            </div>

            <div class="app-divider border-start border-body border-1"></div>
            <div class="btn-group" role="group">
                <button id="app-btn-pencil" type="button" class="btn-icon border-0 active">
                    <i class="bi bi-pencil"></i>
                </button>
                <button id="app-btn-line" type="button" class="btn-icon border-0">
                    <i class="bi bi-dash-lg"></i>
                </button>
                <button id="app-btn-rect" type="button" class="btn-icon border-0">
                    <i class="bi bi-square"></i>
                </button>
                <button id="app-btn-rect-fill" type="button" class="btn-icon border-0">
                    <i class="bi bi-square-fill"></i>
                </button>
                <button id="app-btn-bucket" type="button" class="btn-icon border-0">
                    <i class="bi bi-paint-bucket"></i>
                </button>
                <button id="app-btn-selection" type="button" class="btn-icon border-0">
                    <i class="bi bi-bounding-box-circles"></i>
                </button>
                <button id="app-btn-eraser" type="button" class="btn-icon border-0">
                    <i class="bi bi-eraser"></i>
                </button>
            </div>

            <div class="app-divider border-start border-body border-1"></div>
            <div class="btn-group" role="group">
                <button id="app-btn-settings" type="button" class="btn-icon border-0 active">
                    <i class="bi bi-plug"></i>
                </button>
                <button id="app-btn-settings" type="button" class="btn-icon border-0">
                    <i class="bi bi-lightning"></i>
                </button>
            </div>
        </div>
        <div>
            <div class="app-canvas-container p-2">
                <canvas id="canvas" width="1000" height="500"></canvas>
            </div>

        </div>
        <div class="p-2 fg-secondary fs-sm" style="position: absolute; bottom:10px;left:0;right:0;">
            <span id="app-status"></span>
        </div>
    </div>
    <script type="module" src="./main.js" defer></script>
</body>

</html>
