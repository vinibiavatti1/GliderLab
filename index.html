<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">

    <title>Document</title>
    <link rel="stylesheet" href="./style.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
</head>




<body class="bg-1">

    <div class="bg-2">
        <div class="p-1">
            <div class="btn-group" role="group">
                <div id="app-btn-settings" class="px-4 fw-bold">
                    <span>Glider Lab</span>
                </div>
            </div>

            <div class="app-divider border-start border-body border-1"></div>
            <div class="btn-group" role="group">
                <button id="app-btn-open" class="btn-icon border-0">
                    <i class="bi bi-file-earmark"></i>
                </button>
                <button id="app-btn-open" class="btn-icon border-0">
                    <i class="bi bi-folder2-open"></i>
                </button>
                <button id="app-btn-save" class="btn-icon border-0">
                    <i class="bi bi-floppy"></i>
                </button>
            </div>

            <div class="app-divider border-start border-body border-1"></div>
            <div class="btn-group" role="group">
                <button id="app-btn-undo" type="button" class="btn-icon border-0" disabled>
                    <i class="bi bi-arrow-counterclockwise"></i>
                </button>
                <button id="app-btn-redo" type="button" class="btn-icon border-0" disabled>
                    <i class="bi bi-arrow-clockwise"></i>
                </button>
            </div>

            <div class="app-divider border-start border-body border-1"></div>
            <div class="btn-group" role="group">
                <button id="app-btn-settings" type="button" class="btn-icon border-0">
                    <i class="bi bi-gear"></i>
                </button>
            </div>

            <div class="app-divider border-start border-body border-1"></div>
            <div class="btn-group" role="group">
                <button id="app-btn-redo" type="button" class="btn-icon border-0">
                    <i class="bi bi-question-circle"></i>
                </button>
                <button id="app-btn-undo" type="button" class="btn-icon border-0">
                    <i class="bi bi-github"></i>
                </button>
            </div>
        </div>
        <div class="p-1 border-1 border-bottom border-body">
            <div class="btn-group" role="group">
                <button id="app-btn-automata" class="btn border-0" data-bs-toggle="dialog"
                    data-bs-target="#automata-dialog">
                    Game of Life - 23/3
                </button>
            </div>

            <div class="app-divider border-start border-body border-1"></div>
            <div class="btn-group" role="group">
                <button id="app-btn-play" class="btn-icon border-0 fg-success">
                    <i class="bi bi-play"></i>
                </button>
                <button id="app-btn-pause" class="btn-icon border-0 fg-warning" disabled>
                    <i class="bi bi-pause"></i>
                </button>
                <button id="app-btn-stop" class="btn-icon border-0 fg-danger" disabled>
                    <i class="bi bi-stop"></i>
                </button>
                <button id="app-btn-step" class="btn-icon border-0">
                    <i class="bi bi-skip-end"></i>
                </button>

            </div>

            <div class="app-divider border-start border-body border-1"></div>
            <div class="btn-group" role="group">
                <button id="app-btn-1x" type="button" class="btn-icon border-0 active">
                    1x
                </button>
                <button id="app-btn-2x" type="button" class="btn-icon border-0">
                    2x
                </button>
                <button id="app-btn-4x" type="button" class="btn-icon border-0">
                    4x
                </button>
                <button id="app-btn-8x" type="button" class="btn-icon border-0">
                    8x
                </button>
                <button id="app-btn-16x" type="button" class="btn-icon border-0">
                    16x
                </button>
            </div>

            <div class="app-divider border-start border-body border-1"></div>
            <div class="btn-group" role="group">
                <button id="app-btn-pencil" type="button" class="btn-icon border-0 active">
                    <i class="bi bi-pencil"></i>
                </button>
                <button id="app-btn-line" type="button" class="btn-icon border-0">
                    <i class="bi bi-dash-lg"></i>
                </button>
                <button id="app-btn-rect" type="button" class="btn-icon border-0">
                    <i class="bi bi-square"></i>
                </button>
                <button id="app-btn-rect-fill" type="button" class="btn-icon border-0">
                    <i class="bi bi-square-fill"></i>
                </button>
                <button id="app-btn-bucket" type="button" class="btn-icon border-0">
                    <i class="bi bi-paint-bucket"></i>
                </button>
                <button id="app-btn-selection" type="button" class="btn-icon border-0">
                    <i class="bi bi-bounding-box-circles"></i>
                </button>
                <button id="app-btn-eraser" type="button" class="btn-icon border-0">
                    <i class="bi bi-eraser"></i>
                </button>
            </div>

            <div class="app-divider border-start border-body border-1"></div>
            <div class="btn-group" role="group">
                <button id="app-btn-settings" type="button" class="btn-icon border-0 active">
                    <i class="bi bi-plug"></i>
                </button>
                <button id="app-btn-settings" type="button" class="btn-icon border-0">
                    <i class="bi bi-lightning"></i>
                </button>
            </div>
        </div>
        <div>
            <div class="app-canvas-container p-2">
                <canvas id="canvas" width="1000" height="500"></canvas>
            </div>

        </div>
        <div class="p-2 fg-secondary fs-sm" style="position: absolute; bottom:10px;left:0;right:0;">
            <span id="app-status"></span>
        </div>
    </div>

    <dialog class="dialog dialog-slide-down dialog-lg" id="automata-dialog">
        <div class="dialog-header">
            <h1 class="dialog-title">Select Automata</h1>
            <button type="button" class="btn-close" data-bs-dismiss="dialog" aria-label="Close"></button>
        </div>
        <div class="p-4 border-bottom border-body">
            <ul class="nav">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="#">Game of Life</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Elementar</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Wire World</a>
                </li>
            </ul>
        </div>
        <div class="dialog-body">
            <div class="form-field mb-3">
                <label for="fieldSelect" class="form-label">Rule:</label>
                <select id="app-gol-rule" class="form-control" id="fieldSelect">
                    <option value="custom">Custom...</option>
                </select>
            </div>
            <div class="form-field mb-3">
                <label for="fieldSelect" class="form-label">Preset:</label>
                <select id="app-gol-rule-preset" class="form-control" id="fieldSelect">
                    <option value="empty" selected>(Empty)</option>
                    <option value="1">Unicorn</option>
                </select>
            </div>
            <div class="form-field mb-3">
                <label for="fieldSelect" class="form-label">Born:</label>
                <div class="btn-group" role="group" aria-label="Basic example">
                    <button type="button" class="btn-solid app-gol-born-btn" data-value="1">1</button>
                    <button type="button" class="btn-solid app-gol-born-btn" data-value="2">2</button>
                    <button type="button" class="btn-solid app-gol-born-btn" data-value="3">3</button>
                    <button type="button" class="btn-solid app-gol-born-btn" data-value="4">4</button>
                    <button type="button" class="btn-solid app-gol-born-btn" data-value="5">5</button>
                    <button type="button" class="btn-solid app-gol-born-btn" data-value="6">6</button>
                    <button type="button" class="btn-solid app-gol-born-btn" data-value="7">7</button>
                    <button type="button" class="btn-solid app-gol-born-btn" data-value="8">8</button>
                    <button type="button" class="btn-solid app-gol-born-btn" data-value="9">9</button>
                </div>
            </div>
            <div class="form-field">
                <label for="fieldSelect" class="form-label">Survive:</label>
                <div class="btn-group" role="group" aria-label="Basic example">
                    <button type="button" class="btn-solid app-gol-survive-btn" data-value="1">1</button>
                    <button type="button" class="btn-solid app-gol-survive-btn" data-value="2">2</button>
                    <button type="button" class="btn-solid app-gol-survive-btn" data-value="3">3</button>
                    <button type="button" class="btn-solid app-gol-survive-btn" data-value="4">4</button>
                    <button type="button" class="btn-solid app-gol-survive-btn" data-value="5">5</button>
                    <button type="button" class="btn-solid app-gol-survive-btn" data-value="6">6</button>
                    <button type="button" class="btn-solid app-gol-survive-btn" data-value="7">7</button>
                    <button type="button" class="btn-solid app-gol-survive-btn" data-value="8">8</button>
                    <button type="button" class="btn-solid app-gol-survive-btn" data-value="9">9</button>
                </div>
            </div>
            <div class="menu">
                <button class="menu-item" type="button" data-bs-value="html">
                    <i class="bi bi-dice-5"></i>
                    <span>HTML</span>
                </button>
                <button class="menu-item" type="button" data-bs-value="css">
                    <i class="bi bi-dice-5"></i>
                    <span>CSS</span>
                </button>
                <button class="menu-item" type="button" data-bs-value="js">
                    <i class="bi bi-dice-5"></i>
                    <span>JavaScript</span>
                </button>
            </div>
        </div>
        <div class="dialog-footer">
            <button type="button" class="btn-solid theme-secondary" data-bs-dismiss="dialog">Close</button>
            <button id="app-automata-select-btn" type="button" class="btn-solid theme-primary"
                data-bs-dismiss="dialog">Select</button>
        </div>
    </dialog>

    <script type="module" src="./main.js" defer></script>
</body>
<template id="app-gol-preview-display">
    <div class="bg-1 border border-subtle rounded-4 overflow-hidden" style="width: 102px;">
        <canvas class="d-block" id="{{app-canvas-id}}" width="100" height="90"></canvas>
        <div id="app-title"
            class="d-flex align-items-center justify-content-center gap-2 p-3 border-top border-subtle fs-xs">
            {{title}}
        </div>
    </div>
</template>

</html>
